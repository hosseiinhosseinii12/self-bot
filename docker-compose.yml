version: "3.9"

services:
  selfbot:
    build: .
    container_name: selfbot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./selfbot:/app/selfbot
      - ./app.py:/app/app.py